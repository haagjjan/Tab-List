name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }}, Apple Silicon)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - macos-26

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install and verify XcodeGen
        run: |
          set -euo pipefail
          brew install xcodegen
          version="$(xcodegen --version)"
          [[ "$version" == "Version: 2.46.0" ]] || {
            echo "::error::Expected XcodeGen 2.46.0, found ${version}"
            exit 1
          }

      - name: Select Xcode 26
        run: Scripts/select_xcode_26.sh

      - name: Validate project metadata
        run: |
          set -euo pipefail
          plutil -lint \
            Config/*.plist \
            Config/*.entitlements \
            Resources/TabList/en.lproj/InfoPlist.strings
          jq empty Resources/TabList/Localizable.xcstrings
          jq empty Resources/TabList/Assets.xcassets/Contents.json
          jq empty Resources/TabList/Assets.xcassets/AppIcon.appiconset/Contents.json
          jq empty Resources/TabList/Assets.xcassets/AccentColor.colorset/Contents.json

      - name: Validate generated artifacts
        if: matrix.os == 'macos-26'
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          Scripts/generate_app_icons.swift \
            Resources/Artwork/TabList-AppIcon-Source.png \
            Resources/TabList/Assets.xcassets/AppIcon.appiconset
          git diff --exit-code -- TabList.xcodeproj Resources/TabList/Assets.xcassets/AppIcon.appiconset

      - name: Run portable core and application-logic tests
        run: swift test

      - name: Run pure-core microbenchmarks
        if: matrix.os == 'macos-26'
        run: Scripts/benchmark_core.sh "${{ runner.temp }}/CoreBenchmarkResults.json"

      - name: Build and test
        env:
          DERIVED_DATA_PATH: ${{ runner.temp }}/TabListDerivedData
          RESULT_BUNDLE_PATH: ${{ runner.temp }}/TabListTests.xcresult
        run: Scripts/ci.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TabListTests-${{ matrix.os }}
          path: ${{ runner.temp }}/TabListTests.xcresult
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload core benchmark results
        if: always() && matrix.os == 'macos-26'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TabListCoreBenchmarks
          path: ${{ runner.temp }}/CoreBenchmarkResults.json
          if-no-files-found: ignore
          retention-days: 14
